# DISCLAIMER: Independent personal project. Not tied to any employer or agency.
# Public market data only. No internal or personal data (no SSNs/PHI). Not financial advice.
#
# "Request analysis" button on the website opens a GitHub issue titled
#   "Analyze IPO: TICKER"   -> added to ipos.txt
#   "Analyze: TICKER"       -> added to watchlist.txt  (several allowed: "Analyze: AMD, MU")
# Only the repo owner and collaborators can trigger it (add your friend under
# Settings -> Collaborators). The job adds the ticker, re-scores, comments the
# link on the issue and closes it.
name: Request analysis

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  add:
    if: >-
      startsWith(github.event.issue.title, 'Analyze') &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Parse request
        id: req
        env:
          TITLE: ${{ github.event.issue.title }}
          N: ${{ github.event.issue.number }}
        run: |
          # Title: "Analyze: KO" or "Analyze: AMD, ASML, MU" or "Analyze IPO: RDDT" (max 15 tickers)
          case "$TITLE" in "Analyze IPO"*) F=ipos.txt; D="IPO Desk";; *) F=watchlist.txt; D="Company Desk";; esac
          LIST=$(echo "$TITLE" | sed -E 's/^Analyze( IPO)?:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr ',;' '  ')
          ADDED=""; COUNT=0
          for T in $LIST; do
            COUNT=$((COUNT+1)); [ $COUNT -gt 15 ] && break
            echo "$T" | grep -Eq '^[A-Z0-9^-]{1,6}([.-][A-Z]{1,2})?$' || continue
            T=$(echo "$T" | sed -E 's/\.([A-Z]{1,2})$/-\1/')     # BRK.B -> BRK-B (Yahoo style)
            grep -Eq "^$T([[:space:]]|$)" watchlist.txt ipos.txt && { ADDED="$ADDED $T"; continue; }
            printf '%s    # requested via issue #%s\n' "$T" "$N" >> "$F"; ADDED="$ADDED $T"
          done
          ADDED=$(echo $ADDED)
          if [ -z "$ADDED" ]; then echo "bad=1" >> $GITHUB_OUTPUT; exit 0; fi
          echo "tickers=$ADDED" >> $GITHUB_OUTPUT; echo "first=${ADDED%% *}" >> $GITHUB_OUTPUT; echo "desk=$D" >> $GITHUB_OUTPUT
      - name: Score
        if: steps.req.outputs.bad != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -r requirements.txt
          python build_site.py
      - name: Save
        if: steps.req.outputs.bad != '1'
        run: |
          git config user.name "investing-site-bot"
          git config user.email "actions@github.com"
          git add watchlist.txt ipos.txt docs/data
          git diff --cached --quiet || git commit -m "Add ${{ steps.req.outputs.tickers }} (issue #${{ github.event.issue.number }})"
          git pull --rebase && git push
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          if [ "${{ steps.req.outputs.bad }}" = "1" ]; then
            gh issue comment $N --repo ${{ github.repository }} --body "Couldn't read a ticker from the title. Use 'Analyze: KO', 'Analyze: AMD, MU' or 'Analyze IPO: RDDT'."
          else
            MISSING=$(python3 -c "import json,sys; d=json.load(open('docs/data/scores.json')); have={s['ticker'] for s in d['stocks']}; print(' '.join(t for t in sys.argv[1:] if t not in have))" ${{ steps.req.outputs.tickers }})
            if [ -n "$MISSING" ]; then
              gh issue comment $N --repo ${{ github.repository }} --body "No market data found for: $MISSING. Either it hasn't started trading yet (use **Upcoming IPOs → Check an upcoming IPO** on the site to analyze it from its prospectus), or it needs an exchange suffix, e.g. RELIANCE.NS for India or SHOP.TO for Canada. Removed from the list."
              for T in $MISSING; do sed -i "/^$T[[:space:]]/d;/^$T\$/d" watchlist.txt ipos.txt; done
              git add watchlist.txt ipos.txt && git commit -m "Remove $MISSING (no market data)" && git pull --rebase && git push || true
            fi
            URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            gh issue comment $N --repo ${{ github.repository }} --body "Done: ${{ steps.req.outputs.tickers }} on the ${{ steps.req.outputs.desk }}. Open $URL and hard-refresh in ~2 minutes (Pages needs a moment to publish)."
          fi
          gh issue close $N --repo ${{ github.repository }}

  # "Save for both of us" on the Upcoming IPOs desk opens an issue titled
  # "Add upcoming IPO: NAME" with the numbers as a ```json block.
  upcoming:
    if: >-
      startsWith(github.event.issue.title, 'Add upcoming IPO') &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and save
        id: save
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > /tmp/issue_body.txt
          if ID=$(python add_upcoming.py /tmp/issue_body.txt 2>/tmp/err.txt); then
            echo "id=$ID" >> $GITHUB_OUTPUT
          else
            echo "error=$(head -c 300 /tmp/err.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi
      - name: Commit
        if: steps.save.outputs.id != ''
        run: |
          git config user.name "investing-site-bot"
          git config user.email "actions@github.com"
          git add docs/data/upcoming.json docs/data/events.json
          git diff --cached --quiet || git commit -m "Upcoming IPO: ${{ steps.save.outputs.id }} (issue #${{ github.event.issue.number }})"
          git pull --rebase && git push
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          if [ -n "${{ steps.save.outputs.id }}" ]; then
            gh issue comment $N --repo ${{ github.repository }} --body "Saved. Open https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#up:${{ steps.save.outputs.id }} and hard-refresh in ~2 minutes."
          else
            gh issue comment $N --repo ${{ github.repository }} --body "Couldn't save: ${{ steps.save.outputs.error }} Use the Save button on the site so the numbers are in the right format."
          fi
          gh issue close $N --repo ${{ github.repository }}
